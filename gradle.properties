# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Disable AGP's OptimizeResourcesTask: it runs `aapt2 optimize
# --shorten-resource-paths` unconditionally in release builds, renaming
# resource paths (e.g. mipmap banner -> res/Ti.png), which Fire TV launchers
# cannot resolve. (The experimental enableResourcePathShortening flag is a
# no-op in AGP 9.x.)
android.enableResourceOptimizations=false
