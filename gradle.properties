# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Disable resource path shortening (AGP experimental): it renames resource paths
# (e.g. mipmap banner -> res/Ti.png), which Fire TV launchers cannot resolve.
android.experimental.enableResourcePathShortening=false
